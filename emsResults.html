<!DOCTYPE html>
<html>
<head>
<title>Responses</title>

<style>

body{
  max-width:900px;
  margin:50px auto;
  font-family:Arial;
  background:#f5f5f5;
}

.card{
  background:white;
  padding:20px;
  margin:10px 0;
  border-radius:10px;
  box-shadow:0 2px 4px rgba(0,0,0,.15);
}

.user{
  font-weight:bold;
  color:#0066cc;
}

.time{
  color:gray;
  font-size:12px;
}

</style>

</head>

<body>

<h1>Live Responses</h1>

<div id="feed"></div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxifUXOrSKpVGpauepoSaWTxrPVc9SqtIKnc_t6SnQUg2xWEHpaTu01B7fn5axf13L6Sw/exec";

async function refresh(){

  const data =
    await fetch(SCRIPT_URL)
      .then(r => r.json());

  data.reverse();

  let html = '';

  data.forEach(row => {

    html += `
      <div class="card">

        <div class="user">
          ${row[1]}
        </div>

        <p>${row[2]}</p>

        <div class="time">
          ${row[0]}
        </div>

      </div>
    `;

  });

  document.getElementById('feed').innerHTML =
    html;

}

refresh();

setInterval(refresh,5000);

</script>

</body>
</html>
