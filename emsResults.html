<!DOCTYPE html>
<html>
<head>
  <title>EMS Survey Results</title>

  <style>

    body{
      max-width:900px;
      margin:50px auto;
      font-family:Arial, sans-serif;
      background:#f5f5f5;
      padding:20px;
    }

    h1{
      text-align:center;
      color:#333;
    }

    .card{
      background:white;
      padding:20px;
      margin:15px 0;
      border-radius:10px;
      box-shadow:0 2px 6px rgba(0,0,0,.15);
    }

    .user{
      font-weight:bold;
      font-size:18px;
      color:#0066cc;
      margin-bottom:10px;
    }

    .response{
      font-size:16px;
      line-height:1.4;
      color:#222;
    }

    .time{
      color:gray;
      font-size:12px;
      margin-top:10px;
    }
    .qr-box{
  position:fixed;
  top:20px;
  right:20px;
  background:white;
  padding:10px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
  text-align:center;
  width:300px;
}

.qr-box img{
  width:280px;
  height:280px;
}

.qr-title{
  font-size:12px;
  margin-bottom:8px;
  font-weight:bold;
}

  </style>

</head>

<body>

<h1>EMS Survey Responses</h1>
 <div class="qr-box">

  <div class="qr-title">
    Scan to Respond
  </div>
  <img
    src="qrcode_vrbanator.github.io.png"
    alt="Take the Survey"
    width="200">
 
 </div>

  <div id="feed">
  Loading responses...
</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxifUXOrSKpVGpauepoSaWTxrPVc9SqtIKnc_t6SnQUg2xWEHpaTu01B7fn5axf13L6Sw/exec";

function refresh() {

  const oldScript =
    document.getElementById("jsonp");

  if (oldScript) {
    oldScript.remove();
  }

  const script =
    document.createElement("script");

  script.id = "jsonp";

  script.src =
    SCRIPT_URL +
    "?callback=showResponses&_=" +
    Date.now();

  document.body.appendChild(script);
}

  let html = "";

  if (data.length === 0) {

    html = `
      <div class="card">
        No responses yet.
      </div>
    `;

  } else {

    data.forEach(row => {

      html += `
        <div class="card">

      `
      : ""

    <!--

      `;

setInterval(refresh, 5000);

</script>

</body>
</html>
