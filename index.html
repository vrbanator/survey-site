<!DOCTYPE html>
<html>
<head>
<title>Suggestion Box</title>
<style>
body{
  font-family:Arial;
  max-width:800px;
  margin:50px auto;
}

input,
textarea{
  width:100%;
  margin-bottom:10px;
  padding:10px;
}

button{
  padding:10px 20px;
}
</style>
</head>

<body>

<h1>EMS Survey</h1>

<p>
<strong>What do you think is essential training for new EMT's?</strong><br>
</p>
<form
  id="surveyForm"
  action="https://script.google.com/macros/s/AKfycbxifUXOrSKpVGpauepoSaWTxrPVc9SqtIKnc_t6SnQUg2xWEHpaTu01B7fn5axf13L6Sw/exec"
method="POST"
  target="hiddenFrame">

  <input
    name="user"
    placeholder="Your Name"
    required>

  <br><br>

  <textarea
    name="response"
    placeholder="Your Response"
    required></textarea>

  <br><br>

  <button type="submit">
    Submit
  </button>

</form>

<iframe
  name="hiddenFrame"
  style="display:none;">
</iframe>

<p id="status"></p>

  <script>

document
  .getElementById("surveyForm")
  .addEventListener("submit", function() {

    document.getElementById("status")
      .innerHTML = "✅ Thank you! Your response has been submitted.";

    setTimeout(() => {

      document.querySelector(
        'input[name="user"]'
      ).value = "";

      document.querySelector(
        'textarea[name="response"]'
      ).value = "";

    }, 500);

});

</script>

</body>

</html>
