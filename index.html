<!DOCTYPE html>
<html>
<head>
<title>Suggestion Box</title>
<style>
body{
  font-family:Arial;
  max-width:800px;
  margin:50px auto;
}

input,
textarea{
  width:100%;
  margin-bottom:10px;
  padding:10px;
}

button{
  padding:10px 20px;
}
</style>
</head>

<body>

<h1>EMS Survey</h1>

<p>
<strong>Question:</strong><br>
What do you think is essential training for new EMT's?
</p>
<form
  action="https://script.google.com/macros/s/AKfycbxxlKIE2qI75P2N52dsO4vT1uQoYFGxYRpSAlA9DA5vpBJNNnHLuz5n2awzvwOKJOzttw/exec"
  method="POST">

  <input
    name="user"
    placeholder="Your Name"
    required>

  <br><br>

  <textarea
    name="response"
    rows="6"
    placeholder="Enter your response"
    required></textarea>

  <br><br>

  <button type="submit">
    Submit
  </button>

</form>

</body>

</html>
